<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Aula Señora</title>

    <meta name="description" content="Plataforma de acompañamiento académico solidario - Aula Señora">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var isVolunteer = /*[[${#authorization.expression('hasRole(''ROLE_VOLUNTARIO'')')}]]*/ false;
        var isAdmin = /*[[${#authorization.expression('hasRole(''ROLE_ADMIN'')')}]]*/ false;
        
        var brandColors = {
            'ESTUDIANTE': { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a', DEFAULT: '#0d9488' },
            'VOLUNTARIO': { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f', DEFAULT: '#d97706' },
            'ADMIN':      { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95', DEFAULT: '#7c3aed' }
        };
        
        var selectedBrand = brandColors['ESTUDIANTE'];
        if (isVolunteer) selectedBrand = brandColors['VOLUNTARIO'];
        if (isAdmin) selectedBrand = brandColors['ADMIN'];

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: selectedBrand
                    }
                }
            }
        }
        /*]]>*/
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/80 backdrop-blur-md border border-white/20 shadow-lg;
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.5s ease-out forwards;
            }
            .animate-fade-in {
                animation: fadeInUp 0.3s ease-out forwards;
            }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-wave-slow { animation: wave 25s linear infinite; }
        .animate-wave-mid { animation: wave 15s linear infinite; }
        .animate-wave-fast { animation: wave 10s linear infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            33% { transform: translateY(-20px) translateX(10px) rotate(5deg); }
            66% { transform: translateY(10px) translateX(-15px) rotate(-5deg); }
        }
        .animate-float {
            animation: float 15s ease-in-out infinite;
        }
    </style>

    <!-- Original Styles (for components not yet migrated) -->
    <link rel="stylesheet" th:href="@{/css/variables.css(v=2)}" />
    <link rel="stylesheet" th:href="@{/css/styles.css(v=10)}" />
    <link rel="stylesheet" th:href="@{/css/components.css(v=2)}" />

    <!-- AOS (Animaciones) & Toastify (Notificaciones) CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <!-- Custom Page CSS -->
    <th:block layout:fragment="page-css"></th:block>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900 overflow-x-hidden">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation (Desktop) -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <!-- Main Content Area -->
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden focus:outline-none">
            
            <!-- Mobile Header (Visible only on small screens) -->
            <div class="md:hidden bg-white border-b border-slate-200 p-4 flex justify-between items-center sticky top-0 z-20 shadow-sm">
                <a th:href="@{/}" class="flex items-center gap-2 group">
                    <div class="p-1.5 bg-brand-50 rounded-lg group-hover:bg-brand-100 transition-colors">
                        <svg class="w-6 h-6 text-brand-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c3 3 9 3 12 0v-5" />
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Aula <span class="text-brand-600">Señora</span></h1>
                </a>
                <button id="mobile-sidebar-toggle" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 focus:outline-none transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>

            <main class="flex-1 w-full relative z-0">
                <!-- Background Animated Waves -->
                <div class="absolute bottom-0 left-0 w-full h-[150px] overflow-hidden z-0 pointer-events-none">
                    <!-- Layer 1 (Back, Slow) -->
                    <div class="absolute bottom-0 left-0 w-[200%] flex animate-wave-slow opacity-40">
                        <svg class="w-[50%] h-[150px]" viewBox="0 0 1200 120" preserveAspectRatio="none"><path class="fill-brand-200" d="M0,60 C300,120 300,0 600,60 C900,120 900,0 1200,60 L1200,120 L0,120 Z"/></svg>
                        <svg class="w-[50%] h-[150px]" viewBox="0 0 1200 120" preserveAspectRatio="none"><path class="fill-brand-200" d="M0,60 C300,120 300,0 600,60 C900,120 900,0 1200,60 L1200,120 L0,120 Z"/></svg>
                    </div>
                    <!-- Layer 2 (Mid) -->
                    <div class="absolute bottom-0 left-0 w-[200%] flex animate-wave-mid opacity-60">
                        <svg class="w-[50%] h-[100px]" viewBox="0 0 1200 120" preserveAspectRatio="none"><path class="fill-brand-300" d="M0,40 C300,100 300,0 600,40 C900,80 900,0 1200,40 L1200,120 L0,120 Z"/></svg>
                        <svg class="w-[50%] h-[100px]" viewBox="0 0 1200 120" preserveAspectRatio="none"><path class="fill-brand-300" d="M0,40 C300,100 300,0 600,40 C900,80 900,0 1200,40 L1200,120 L0,120 Z"/></svg>
                    </div>
                    <!-- Layer 3 (Front, Fast) -->
                    <div class="absolute bottom-0 left-0 w-[200%] flex animate-wave-fast opacity-80">
                        <svg class="w-[50%] h-[70px]" viewBox="0 0 1200 120" preserveAspectRatio="none"><path class="fill-brand-400" d="M0,80 C300,0 300,120 600,80 C900,0 900,120 1200,80 L1200,120 L0,120 Z"/></svg>
                        <svg class="w-[50%] h-[70px]" viewBox="0 0 1200 120" preserveAspectRatio="none"><path class="fill-brand-400" d="M0,80 C300,0 300,120 600,80 C900,0 900,120 1200,80 L1200,120 L0,120 Z"/></svg>
                    </div>
                </div>

                <!-- Upper Background Glassy Orbs (Contrast) -->
                <div class="absolute top-0 left-0 w-full h-[500px] overflow-hidden z-0 pointer-events-none">
                    <!-- Esfera 1 -->
                    <div class="absolute top-[-5%] right-[5%] w-72 h-72 rounded-full border border-brand-300/20 bg-brand-400/5 backdrop-blur-xl animate-float">
                        <div class="absolute top-1/4 left-1/4 w-full h-full bg-gradient-to-br from-white/10 to-transparent rounded-full"></div>
                    </div>
                    <!-- Esfera 2 -->
                    <div class="absolute top-[15%] left-[10%] w-48 h-48 rounded-full border border-purple-300/20 bg-purple-400/5 backdrop-blur-lg animate-float" style="animation-delay: 4s;">
                        <div class="absolute top-1/4 left-1/4 w-full h-full bg-gradient-to-br from-white/10 to-transparent rounded-full"></div>
                    </div>
                </div>

                <!-- Global Messages Banner -->
                <div th:if="${isDashboard != null and isDashboard and !#lists.isEmpty(mensajesGlobalesActivos)}" class="relative z-20 px-6 pt-6 pb-0 max-w-6xl mx-auto space-y-3">
                    <div th:each="msg : ${mensajesGlobalesActivos}" class="bg-brand-600 rounded-xl p-4 shadow-lg flex gap-4 items-start animate-fade-in-up">
                        <div class="p-2 bg-white/20 rounded-lg text-white flex-shrink-0">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                        </div>
                        <div>
                            <h4 class="text-white font-bold text-sm" th:text="${msg.titulo}">Aviso Importante</h4>
                            <p class="text-brand-50 text-sm mt-1" th:text="${msg.contenido}">Contenido del aviso...</p>
                        </div>
                    </div>
                </div>

                <!-- Content will be injected here by specific views -->
                <div layout:fragment="content" class="h-full relative z-10"></div>
            </main>
        </div>
    </div>

    <!-- Script for mobile sidebar toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileBtn = document.getElementById('mobile-sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            
            if (mobileBtn && sidebar) {
                mobileBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('hidden');
                    sidebar.classList.toggle('absolute');
                    sidebar.classList.toggle('inset-y-0');
                    sidebar.classList.toggle('left-0');
                    sidebar.classList.toggle('shadow-2xl');
                });
            }
        });
    </script>

    <!-- Archivo JS Global -->
    <script th:src="@{/js/main.js}"></script>

    <!-- AOS & Toastify JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Custom Page JS -->
    <th:block layout:fragment="page-js"></th:block>

</body>
</html>
