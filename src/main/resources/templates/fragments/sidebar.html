<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- Reusable Sidebar for Dashboards -->
    <aside th:fragment="sidebar" id="sidebar" class="bg-white/80 backdrop-blur-xl border-r border-slate-200/50 shadow-[4px_0_24px_rgba(0,0,0,0.02)] w-full md:w-64 flex-shrink-0 hidden md:flex flex-col transition-all duration-300 relative z-20 min-h-screen">
        <div class="p-6 border-b border-slate-200/50 hidden md:block">
            <a th:href="@{/}" class="flex items-center gap-3 group w-fit">
                <div class="p-2.5 bg-gradient-to-br from-brand-50 to-brand-100 rounded-xl group-hover:shadow-md group-hover:scale-105 transition-all duration-300 border border-brand-200/50">
                    <svg class="w-6 h-6 text-brand-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                        <path d="M6 12v5c3 3 9 3 12 0v-5" />
                    </svg>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-800">Aula <span class="text-brand-600">Señora</span></span>
            </a>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-6">
            <ul class="space-y-1.5 px-3">
                
                <!-- ESTUDIANTE LINKS -->
                <th:block sec:authorize="hasAnyRole('ESTUDIANTE', 'USER')">
                    <li>
                        <a th:href="@{/student/dashboard(tab='inicio')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'inicio'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'inicio'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Inicio
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/dashboard(tab='aulas')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'aulas'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'aulas'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            Mis Aulas
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/dashboard(tab='solicitudes')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'solicitudes'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'solicitudes'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            Mis Solicitudes
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/dashboard(tab='explorar')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'explorar'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'explorar'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            Explorar Aulas
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/schedule}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'horarios'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'horarios'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Horarios
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/profile}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'perfil'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'perfil'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Mi Perfil
                        </a>
                    </li>
                </th:block>

                <!-- VOLUNTARIO LINKS -->
                <th:block sec:authorize="hasRole('VOLUNTARIO')">
                    <li>
                        <a th:href="@{/volunteer/dashboard(tab='inicio')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'inicio'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'inicio'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Inicio
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/volunteer/dashboard(tab='aulas')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'aulas'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'aulas'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            Mis Aulas
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/volunteer/dashboard(tab='solicitudes')}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'solicitudes'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'solicitudes'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            Solicitudes
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/volunteer/schedule}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'horarios'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'horarios'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Mi Calendario
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/volunteer/profile}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'perfil'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'perfil'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Mi Perfil
                        </a>
                    </li>
                </th:block>

                <!-- ADMIN LINKS -->
                <th:block sec:authorize="hasRole('ADMIN')">
                    <li>
                        <a th:href="@{/admin/dashboard}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all duration-300 hover:translate-x-1"
                           th:classappend="${activeTab == 'dashboard'} ? 'bg-brand-50/80 text-brand-700 shadow-sm border border-brand-100' : 'text-slate-600 hover:bg-slate-50/80 hover:text-brand-600 border border-transparent'">
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" th:classappend="${activeTab == 'dashboard'} ? 'text-brand-600' : 'text-slate-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            Panel Admin
                        </a>
                    </li>
                </th:block>

            </ul>
        </nav>
        
        <div class="p-4 border-t border-slate-200/50 bg-slate-50/30">
            <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/60 transition-colors border border-transparent hover:border-slate-200/50 hover:shadow-sm group">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-100 to-brand-50 flex items-center justify-center text-brand-700 font-bold text-lg border border-brand-200/60 shadow-sm group-hover:scale-105 transition-transform duration-300 shrink-0 overflow-hidden">
                    <img th:if="${currentUser != null and !#strings.isEmpty(currentUser.profileImageUrl)}" 
                         th:src="${currentUser.profileImageUrl}" 
                         alt="Perfil" class="w-full h-full object-cover">
                    <span th:unless="${currentUser != null and !#strings.isEmpty(currentUser.profileImageUrl)}"
                          th:text="${currentUser != null and currentUser.firstName != null ? #strings.substring(currentUser.firstName, 0, 1).toUpperCase() : #strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <div class="flex-1 overflow-hidden transition-all duration-300">
                    <p class="text-sm font-semibold text-slate-800 line-clamp-1" sec:authentication="name">Usuario</p>
                    <p class="text-xs text-slate-500 capitalize" th:text="${#strings.toLowerCase(#strings.replace(#authentication.authorities[0].authority, 'ROLE_', ''))}">Rol</p>
                </div>
                
                <!-- Quick Logout Button in Sidebar -->
                <form th:action="@{/logout}" method="post" class="m-0 shrink-0">
                    <button type="submit" class="p-2 text-slate-400 hover:text-red-600 bg-slate-100/80 hover:bg-red-50 rounded-lg transition-all focus:ring-2 focus:ring-red-100 border border-slate-200/80 hover:border-red-200 shadow-sm" title="Cerrar Sesión">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </form>
            </div>
        </div>
    </aside>
</body>
</html>
