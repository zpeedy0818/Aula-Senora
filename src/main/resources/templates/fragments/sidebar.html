<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- Reusable Sidebar for Dashboards -->
    <aside th:fragment="sidebar" id="sidebar" class="bg-white border-r border-slate-200 w-full md:w-64 flex-shrink-0 hidden md:flex flex-col transition-all duration-300 relative z-10 min-h-screen">
        <div class="p-6 border-b border-slate-100 hidden md:block">
            <a th:href="@{/}" class="flex items-center gap-2 group w-fit">
                <div class="p-2 bg-brand-50 rounded-xl group-hover:bg-brand-100 transition-colors">
                    <svg class="w-6 h-6 text-brand-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                        <path d="M6 12v5c3 3 9 3 12 0v-5" />
                    </svg>
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-800">Aula <span class="text-brand-600">Señora</span></span>
            </a>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1 px-3">
                
                <!-- ESTUDIANTE LINKS -->
                <th:block sec:authorize="hasAnyRole('ESTUDIANTE', 'USER')">
                    <li>
                        <!-- For the active state, you'd ideally check the current URI. Here we just assume standard styling -->
                        <a th:href="@{/student/dashboard}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-brand-50 hover:text-brand-600 rounded-xl font-medium transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Inicio
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/schedule}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-brand-600 rounded-xl font-medium transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Horarios
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/student/profile}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-brand-600 rounded-xl font-medium transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Mi Perfil
                        </a>
                    </li>
                </th:block>

                <!-- VOLUNTARIO LINKS -->
                <th:block sec:authorize="hasRole('VOLUNTARIO')">
                    <li>
                        <a th:href="@{/volunteer/dashboard}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-brand-50 hover:text-brand-600 rounded-xl font-medium transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Panel Principal
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/volunteer/aulas}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-brand-600 rounded-xl font-medium transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            Mis Aulas
                        </a>
                    </li>
                </th:block>

                <!-- ADMIN LINKS -->
                <th:block sec:authorize="hasRole('ADMIN')">
                    <li>
                        <a th:href="@{/admin/dashboard}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-brand-50 hover:text-brand-600 rounded-xl font-medium transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            Panel Admin
                        </a>
                    </li>
                </th:block>

            </ul>
        </nav>
        
        <div class="p-4 border-t border-slate-200">
            <div class="flex items-center gap-3 px-4 py-2 relative group">
                <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-600 font-bold text-lg border border-brand-200 shadow-sm group-hover:scale-105 transition-transform">
                    <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-sm font-medium text-slate-800 line-clamp-1" sec:authentication="name">Usuario</p>
                    <p class="text-xs text-slate-500 capitalize" sec:authentication="principal.authorities[0]">Rol</p>
                </div>
                
                <!-- Quick Logout Button in Sidebar -->
                <form th:action="@{/logout}" method="post" class="m-0 absolute right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button type="submit" class="p-1.5 text-red-500 hover:bg-red-50 rounded-lg" title="Cerrar Sesión">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </form>
            </div>
        </div>
    </aside>
</body>
</html>
